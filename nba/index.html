<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketbolistai — Playoff Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f0f0f0;
  color: #222;
  font-family: 'Atlas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  line-height: 1.5;
  padding: 20px;
  max-width: 1060px;
  margin: 0 auto;
}

.header {
  border-bottom: 2px solid #222;
  padding-bottom: 12px;
  margin-bottom: 32px;
}

h1 {
  font-size: 2rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 2px;
  color: #222;
}

.subtitle {
  color: #888;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
}

h2 {
  font-size: 1.1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 16px;
  color: #222;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h2 .toggle-arrow {
  font-size: 0.7rem;
  color: #aaa;
  transition: transform 0.2s;
}

h2:hover {
  color: #d64541;
}

.section {
  margin-bottom: 44px;
}

.section-content {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
  max-height: 8000px;
  opacity: 1;
}

.section.collapsed .section-content {
  max-height: 0;
  opacity: 0;
  margin: 0;
}

.section.collapsed h2 {
  margin-bottom: 0;
  border-bottom-color: transparent;
}

.section.collapsed h2 .toggle-arrow {
  transform: rotate(-90deg);
}

/* Standings table */
.standings-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.standings-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #ccc;
  color: #666;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.standings-table td {
  padding: 7px 10px;
  border-bottom: 1px solid #e0e0e0;
}

.standings-table tr:hover {
  background: #e8e8e8;
}

.standings-table .team-name {
  font-weight: 600;
  color: #222;
}

.standings-table tr.playoff-line td {
  border-bottom: 2px solid #d64541;
}

.standings-table .seed-col {
  color: #d64541;
  font-weight: 700;
  width: 36px;
}

.standings-table .eff-wins {
  color: #555;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* RIP section */
.rip-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 800px) {
  .rip-grid { grid-template-columns: 1fr; }
}

.rip-card {
  background: #fff;
  border-radius: 4px;
  padding: 16px 20px;
  border: 1px solid #ddd;
  border-left: 3px solid #666;
}

.rip-team {
  font-size: 0.78rem;
  font-weight: 700;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.rip-epitaph {
  font-size: 0.8rem;
  color: #555;
  line-height: 1.5;
}

/* Bracket */
.bracket-container {
  background: #fff;
  border-radius: 4px;
  padding: 20px 24px;
  border: 1px solid #ddd;
  overflow-x: auto;
}

.bracket-grid {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) minmax(170px, 1fr) minmax(160px, 1fr);
  gap: 0;
  min-width: 600px;
}

.bracket-round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 0 6px;
}

.bracket-matchup {
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin: 6px 0;
}

.bracket-team {
  display: flex;
  align-items: center;
  padding: 7px 10px;
  background: #f7f7f7;
  border: 1px solid #ddd;
  font-size: 0.82rem;
  font-weight: 500;
  color: #333;
  white-space: nowrap;
  position: relative;
}

.bracket-team:first-child {
  border-radius: 4px 4px 0 0;
  border-bottom: none;
}

.bracket-team:last-child {
  border-radius: 0 0 4px 4px;
}

.bracket-team .seed {
  color: #d64541;
  font-weight: 700;
  margin-right: 6px;
  font-size: 0.72rem;
  min-width: 18px;
}

.bracket-team .pct {
  margin-left: auto;
  padding-left: 8px;
  color: #888;
  font-weight: 700;
  font-size: 0.72rem;
}

.bracket-team.winner {
  background: #e8f5e9;
  font-weight: 700;
  border-color: #4caf50;
}

.bracket-team.loser {
  background: #fafafa;
  color: #bbb;
  text-decoration: line-through;
}

.bracket-team.loser .seed { color: #ccc; }
.bracket-team.loser .pct { color: #ccc; }

.bracket-team.clickable {
  cursor: pointer;
  transition: all 0.12s;
}

.bracket-team.clickable:hover {
  background: #eef;
  border-color: #999;
}

.bracket-team.selected {
  background: #d64541 !important;
  border-color: #d64541 !important;
  color: #fff;
}

.bracket-team.selected .seed {
  color: #ffcdd2;
}

.bracket-team.selected .pct {
  color: #ffcdd2;
}

.bracket-team.favorite {
  background: #fff;
  font-weight: 600;
}

.bracket-label {
  text-align: center;
  color: #999;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 4px 0 6px;
  font-weight: 600;
}

/* R1 Result Cards */
.r1-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 800px) {
  .r1-grid { grid-template-columns: 1fr; }
}

.r1-card {
  background: #fff;
  border-radius: 4px;
  padding: 16px 20px;
  border: 1px solid #ddd;
}

.r1-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.r1-team {
  font-size: 0.82rem;
  font-weight: 700;
}

.r1-team .r1-seed {
  color: #d64541;
  font-size: 0.7rem;
  margin-right: 4px;
}

.r1-team.winner { color: #2e7d32; }
.r1-team.loser { color: #999; }

.r1-score {
  font-size: 1.1rem;
  font-weight: 900;
  color: #222;
  letter-spacing: 1px;
}

.r1-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 6px;
  margin-bottom: 8px;
}

.r1-cat {
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.r1-cat.w1 { background: #e8f5e9; color: #2e7d32; }
.r1-cat.w2 { background: #fce4ec; color: #c62828; }

.r1-blurb {
  font-size: 0.75rem;
  color: #666;
  line-height: 1.4;
  font-style: italic;
}

/* Advancement table */
.advancement-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 0.85rem;
}

.advancement-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #ccc;
  color: #666;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  user-select: none;
  transition: color 0.15s;
}

.advancement-table th:hover {
  color: #d64541;
}

.advancement-table th.sort-active {
  color: #d64541;
}

.advancement-table th .sort-arrow {
  margin-left: 4px;
  font-size: 0.6rem;
}

.advancement-table td {
  padding: 7px 10px;
  border-bottom: 1px solid #e0e0e0;
  font-variant-numeric: tabular-nums;
}

.advancement-table .team-name {
  font-weight: 600;
  color: #222;
}

.advancement-table tr.eliminated td {
  color: #bbb;
}

.advancement-table tr.eliminated .team-name {
  color: #bbb;
  text-decoration: line-through;
}

/* ELO Timeline */
.timeline-container {
  background: #fff;
  border-radius: 4px;
  padding: 16px 20px;
  border: 1px solid #ddd;
  position: relative;
}

.timeline-container canvas {
  height: 400px;
}

.timeline-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 12px;
  justify-content: center;
}

.tl-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.72rem;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.15s;
}

.tl-legend-item.dimmed {
  opacity: 0.3;
}

.tl-legend-swatch {
  width: 14px;
  height: 3px;
  border-radius: 1px;
}

/* Season awards */
.awards-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.awards-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #ccc;
  color: #666;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.awards-table td {
  padding: 8px 10px;
  border-bottom: 1px solid #e0e0e0;
}

.awards-table .cat-name { font-weight: 700; color: #d64541; }
.awards-table .team-name { font-weight: 600; color: #222; }

/* Radar grid */
.radar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.radar-card {
  background: #fff;
  border-radius: 4px;
  padding: 14px;
  border: 1px solid #ddd;
  text-align: center;
}

.radar-card h3 {
  font-size: 0.82rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: #222;
}

.radar-blurb {
  font-size: 0.7rem;
  color: #888;
  line-height: 1.4;
  margin-bottom: 6px;
  font-style: italic;
}

.radar-card canvas { max-height: 200px; }

.radar-card.playoff {
  border-left: 3px solid #d64541;
}

/* Superlatives */
.superlatives-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.superlative-card {
  background: #fff;
  border-radius: 4px;
  padding: 14px 16px;
  border: 1px solid #ddd;
  border-left: 3px solid #d64541;
}

.superlative-team {
  font-size: 0.75rem;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.superlative-award {
  font-size: 0.95rem;
  font-weight: 700;
  color: #222;
  margin-bottom: 6px;
}

.superlative-reason {
  font-size: 0.78rem;
  color: #666;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 0.72rem;
  margin-top: 48px;
  padding: 16px;
  border-top: 1px solid #ddd;
}

@media (max-width: 600px) {
  h1 { font-size: 1.4rem; }
  body { padding: 12px; }
  .radar-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .radar-card { padding: 10px; }
  .superlatives-grid { grid-template-columns: 1fr; }
  .r1-grid { grid-template-columns: 1fr; }
}
</style>

function getH2H(t1, t2) {
  const key1 = t1 + ' vs ' + t2;
  const key2 = t2 + ' vs ' + t1;
  if (DATA.h2h_matrix[key1] !== undefined) return DATA.h2h_matrix[key1];
  if (DATA.h2h_matrix[key2] !== undefined) return 100 - DATA.h2h_matrix[key2];
  return 50;
}

// Determine R1 winners/losers from results
const R1 = DATA.bracket.r1_results;
const R1_WINNERS = {};
const R1_LOSERS = {};
R1.forEach(m => {
  if (m.score1 > m.score2) {
    R1_WINNERS[m.team1] = m.score1 + '-' + m.score2;
    R1_LOSERS[m.team2] = m.score2 + '-' + m.score1;
  } else {
    R1_WINNERS[m.team2] = m.score2 + '-' + m.score1;
    R1_LOSERS[m.team1] = m.score1 + '-' + m.score2;
  }
});

const bracketState = { sf: [null, null] };

function bracketClickSF(sfIdx, team) {
  bracketState.sf[sfIdx] = bracketState.sf[sfIdx] === team ? null : team;
  renderBracket();
}

function renderBracket() {
  const seeds = DATA.bracket.seeds;
  const qfPairs = [[0,7],[1,6],[2,5],[3,4]];

  function teamHtmlFixed(name, score, isWinner) {
    const seed = SEED_OF[name];
    const cls = isWinner ? 'winner' : 'loser';
    return `<div class="bracket-team ${cls}">
      <span class="seed">#${seed}</span>${name}<span class="pct">${score}</span>
    </div>`;
  }

  function teamHtmlClick(name, pct, isFav, cls, round, matchIdx) {
    const seed = SEED_OF[name];
    return `<div class="bracket-team ${cls} ${isFav ? 'favorite' : ''}" data-round="${round}" data-match="${matchIdx}" data-team="${name.replace(/"/g, '&quot;')}">
      <span class="seed">#${seed}</span>${name}<span class="pct">${pct.toFixed(0)}%</span>
    </div>`;
  }

  function placeholderTeam(text) {
    return `<div class="bracket-team" style="border-radius:4px;border:1px dashed #ccc;background:transparent;color:#aaa;justify-content:center;font-style:italic;font-size:0.75rem">${text}</div>`;
  }

  // QF round — locked results
  let qfHtml = '<div class="bracket-label">Quarterfinals</div>';
  R1.forEach(m => {
    const w1 = m.score1 > m.score2;
    qfHtml += `<div class="bracket-matchup">
      ${teamHtmlFixed(m.team1, m.score1, w1)}
      ${teamHtmlFixed(m.team2, m.score2, !w1)}
    </div>`;
  });

  // SF round — clickable
  let sfHtml = '<div class="bracket-label">Semifinals</div>';
  SF.forEach((sf, si) => {
    const t1 = sf.team1, t2 = sf.team2;
    const p = getH2H(t1, t2);
    const picked = bracketState.sf[si];
    const cls1 = picked === t1 ? 'clickable selected' : 'clickable';
    const cls2 = picked === t2 ? 'clickable selected' : 'clickable';
    sfHtml += `<div class="bracket-matchup" style="flex:1">
      ${teamHtmlClick(t1, p, p >= 50, cls1, 'sf', si)}
      ${teamHtmlClick(t2, 100 - p, 100 - p >= 50, cls2, 'sf', si)}
    </div>`;
  });

  // Finals
  let finalsHtml = '<div class="bracket-label">Finals</div>';
  const f1 = bracketState.sf[0];
  const f2 = bracketState.sf[1];
  if (f1 && f2) {
    const p = getH2H(f1, f2);
    const seed1 = SEED_OF[f1], seed2 = SEED_OF[f2];
    finalsHtml += `<div class="bracket-matchup" style="flex:1">
      <div class="bracket-team ${p >= 50 ? 'favorite' : ''}"><span class="seed">#${seed1}</span>${f1}<span class="pct">${p.toFixed(0)}%</span></div>
      <div class="bracket-team ${100-p >= 50 ? 'favorite' : ''}"><span class="seed">#${seed2}</span>${f2}<span class="pct">${(100-p).toFixed(0)}%</span></div>
    </div>`;
  } else {
    finalsHtml += `<div class="bracket-matchup" style="flex:1">
      ${placeholderTeam('Pick SF winners')}
    </div>`;
  }

  const container = document.getElementById('bracket-visual');
  container.innerHTML = `<div class="bracket-grid">
    <div class="bracket-round">${qfHtml}</div>
    <div class="bracket-round">${sfHtml}</div>
    <div class="bracket-round">${finalsHtml}</div>
  </div>`;

  container.onclick = function(e) {
    const el = e.target.closest('.bracket-team.clickable');
    if (!el) return;
    const round = el.dataset.round;
    const matchIdx = parseInt(el.dataset.match);
    const team = el.dataset.team;
    if (round === 'sf') bracketClickSF(matchIdx, team);
  };
}

    } else {
      sortCol = col;
      sortAsc = colDef.asc;
    }
    render();
  });

  render();
})();

// 4. ELO Power Rankings Timeline
(function() {
  const ctx = document.getElementById('timeline-chart').getContext('2d');
  const timeline = DATA.elo_timeline;
  const sfTeams = SF.map(s => [s.team1, s.team2]).flat();
  const playoffTeams = DATA.bracket.seeds;

  // Team colors — SF teams get bold colors, others are grey
  const TEAM_COLORS = {
    'Dydis nesvarbu': '#2196F3',
    'Scottie does know': '#4CAF50',
    'DomiNiko LaJokic': '#FF9800',
    'Jaunas tiltas ir kamuolys.': '#9C27B0',
    'Amen to That': '#d64541',
    "Hard'n'Braun": '#795548',
    'Champagnie Showers': '#00BCD4',
    'Lazdavotojai': '#E91E63',
    'Hart attack': '#bbb',
    'Jackson brothers': '#bbb',
    'SkinnyHeadLuka': '#bbb',
    'Slim Twins Wins': '#bbb',
    'ADK(H)D': '#bbb',
    'Beaves and Butthead': '#bbb',
  };

  const allTeams = DATA.standings.map(s => s.team);
  // Sort: SF teams first, then other playoff, then rest
  const elimPlayoff = playoffTeams.filter(t => !sfTeams.includes(t));
  const nonPlayoff = allTeams.filter(t => !playoffTeams.includes(t));
  const ordered = [...sfTeams, ...elimPlayoff, ...nonPlayoff];

  const maxLen = Math.max(...Object.values(timeline).map(v => v.length));
  const labels = Array.from({length: maxLen}, (_, i) => i === 0 ? 'Pre' : i <= 18 ? 'W' + i : 'QF');

  // Track hidden state
  const hidden = {};

  const datasets = ordered.map(team => {
    const color = TEAM_COLORS[team] || '#bbb';
    const isSF = sfTeams.includes(team);
    const isPlayoff = playoffTeams.includes(team);
    // Non-playoff teams: truncate data at W18 (index 18), use null for W19
    let data = timeline[team];
    if (!isPlayoff && data.length > 19) {
      data = data.slice(0, 19).concat(Array(data.length - 19).fill(null));
    }
    return {
      label: team,
      data: data,
      borderColor: color,
      backgroundColor: color,
      borderWidth: isSF ? 2.5 : isPlayoff ? 1.5 : 1,
      pointRadius: 0,
      pointHoverRadius: 4,
      tension: 0.3,
      spanGaps: false,
      borderDash: isPlayoff ? [] : [4, 3],
      hidden: !isSF,
    };
  });

  const chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(0,0,0,0.8)',
          titleFont: { size: 11 },
          bodyFont: { size: 11 },
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(0);
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#eee' },
          ticks: { font: { size: 10 }, color: '#888' }
        },
        y: {
          grid: { color: '#eee' },
          ticks: {
            font: { size: 10 },
            color: '#888',
            callback: v => v.toFixed(0)
          },
          title: {
            display: true,
            text: 'Aggregate ELO',
            font: { size: 11, weight: '600' },
            color: '#888'
          }
        }
      }
    }
  });

  // Custom legend with click-to-toggle
  const legendDiv = document.getElementById('timeline-legend');
  ordered.forEach((team, i) => {
    const color = TEAM_COLORS[team] || '#bbb';
    const item = document.createElement('div');
    item.className = 'tl-legend-item' + (datasets[i].hidden ? ' dimmed' : '');
    item.innerHTML = `<span class="tl-legend-swatch" style="background:${color}"></span>${team}`;
    item.addEventListener('click', () => {
      const ds = chart.data.datasets[i];
      ds.hidden = !ds.hidden;
      item.classList.toggle('dimmed', ds.hidden);
      chart.update();
    });
    legendDiv.appendChild(item);
  });
})();

// 5. Standings table
(function() {
  const table = document.getElementById('standings-table');
  let html = '<thead><tr><th>#</th><th>Team</th><th>Record</th><th>Eff W</th></tr></thead><tbody>';

      <td${dimStyle}>${t.record}</td>
      <td class="eff-wins"${dimStyle}>${t.eff_wins.toFixed(1)}</td>
    </tr>`;
  });
  html += '</tbody>';
  table.innerHTML = html;
})();

// 6. Radar charts — SF teams first, then eliminated playoff, then non-playoff
(function() {
  const grid = document.getElementById('radar-grid');
  const labels = DATA.cat_labels;
  const sfTeams = SF.map(s => [s.team1, s.team2]).flat();
  const playoffTeams = DATA.bracket.seeds;

  const teamBlurbs = {
    "Hard'n'Braun": "Elite in six cats. Eliminated R1 by Jaunas tiltas 3-6.",
    "Amen to That": "Punt FT/3PM extreme. League-best in four cats, league-worst in two. Eliminated R1 by DomiNiko 4-5.",
    "Scottie does know": "Punt-scoring build with league-best blocks and TOs. Advanced to SF.",
    "DomiNiko LaJokic": "Punt-blocks done right. League-best AST. Upset the #1 seed. Advanced to SF.",
    "Champagnie Showers": "Punt-assists extreme. League-best 3PM. Eliminated R1 by Scottie 4-5.",
    "Dydis nesvarbu": "Well-rounded punt-blocks. Elite 3PM, STL, FT, AST. Dominated R1 7-2.",
    "Jaunas tiltas ir kamuolys.": "Elite AST, STL, TO discipline. Demolished the #2 seed 6-3. Advanced to SF.",
    "Lazdavotojai": "League-best scoring with elite FG%. Eliminated R1 by Dydis 2-7.",
    "SkinnyHeadLuka": "Elite FG% with solid scoring and blocks.",
    "Jackson brothers": "Solid FG%, AST, STL, but FT and 3PM are backbreaking.",
    "Hart attack": "Elite AST and BLK, but scoring and FG% are punted.",
    "Slim Twins Wins": "League-best FTs and TOs with solid blocks.",
    "ADK(H)D": "Scores and shoots threes, but BLK and AST are massive holes.",
    "Beaves and Butthead": "Slight edges in boards and assists, negative everywhere else.",
  };

  const allTeams = DATA.standings.map(s => s.team);
  const nonPlayoff = allTeams.filter(t => !playoffTeams.includes(t));
  const elimPlayoff = playoffTeams.filter(t => !sfTeams.includes(t));
  const ordered = [...sfTeams, ...elimPlayoff, ...nonPlayoff];

  ordered.forEach(team => {
    const values = DATA.radar_data[team];
    if (!values) return;
    const isSF = sfTeams.includes(team);
    const blurb = teamBlurbs[team] || '';
    const card = document.createElement('div');
    card.className = isSF ? 'radar-card playoff' : 'radar-card';
    card.innerHTML = `<h3>${team}</h3><p class="radar-blurb">${blurb}</p><canvas></canvas>`;
    grid.appendChild(card);

    const ctx = card.querySelector('canvas').getContext('2d');
    const shifted = values.map(v => v + 150);
    const color = isSF ? '#d64541' : '#999';
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: labels,
        datasets: [{
          data: shifted,
          backgroundColor: isSF ? 'rgba(214, 69, 65, 0.15)' : 'rgba(150, 150, 150, 0.1)',
          borderColor: color,
          borderWidth: 2,
          pointBackgroundColor: color,
          pointRadius: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) { return (ctx.raw - 150 >= 0 ? '+' : '') + (ctx.raw - 150); }
            }
          }
        },
        scales: {
          r: {
            min: 0,
            max: 300,
            ticks: {
              stepSize: 75,
              color: '#aaa',
              backdropColor: 'transparent',
              font: { size: 8 },
              callback: v => { const d = v - 150; return d === 0 ? '0' : (d > 0 ? '+' + d : d); }
            },
            grid: { color: '#e0e0e0' },
            angleLines: { color: '#e0e0e0' },
            pointLabels: {
              color: '#666',
              font: { size: 10, weight: '600' }
            }
          }
        }
      }
    });
  });
})();

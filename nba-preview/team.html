<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketbolistai 2026-27 Team view</title>
<meta name="description" content="One team&#x27;s week, players, schedule and season in the Basketbolistai fantasy basketball league.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<style>:root{
--bg:#f0f0f0;--card:#fff;--ink:#222;--ink-2:#555;--muted:#8a8a8a;--rule:#d9d9d9;--rule-2:#ececec;
--accent:#e8743b;--good:#2f8f5e;--good-soft:rgba(47,143,94,.14);--weak:#e8743b;--weak-soft:rgba(232,116,59,.16);
--bad:#c93a3a;--bad-soft:rgba(201,58,58,.15);
--sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
--mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;
padding:28px 16px 56px;max-width:1080px;margin:0 auto;-webkit-font-smoothing:antialiased}
.nowrap{white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:0}
h1{font-size:2.9rem;font-weight:900;letter-spacing:-1.2px;line-height:1.02;margin:2px 0 8px}
.dek{font-size:1.08rem;color:var(--ink-2);max-width:680px;margin-bottom:8px}
.byline{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* nav */
nav{display:flex;flex-wrap:wrap;gap:0 22px;border-bottom:1px solid var(--rule);margin:0 0 34px;padding:10px 0 0;
position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
nav a{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-2);
text-decoration:none;padding:6px 0 9px;border-bottom:3px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}

/* sections */
section{margin-bottom:52px;scroll-margin-top:64px}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-bottom:8px}
h3{font-size:.74rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-2);margin-bottom:8px}
.intro{color:var(--ink-2);font-size:.9rem;margin-bottom:16px;max-width:760px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* tables */
table.grid{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--card)}
.grid th{text-align:left;padding:10px 8px 8px;border-bottom:2px solid var(--ink);color:var(--ink);font-size:.64rem;
font-weight:700;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;vertical-align:bottom}
.grid td{padding:7px 8px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.grid tbody tr:hover td{background-color:rgba(0,0,0,.025)}
.grid tr.cutline td{border-bottom:2px dashed var(--ink)}
.num{text-align:right;white-space:nowrap}
.grid th.num{text-align:right}
.rank{font-family:var(--mono);font-weight:500;color:var(--muted)}
.team{font-weight:700;color:var(--ink);white-space:nowrap}
.sub{color:var(--muted);font-size:.74rem;font-weight:400}
.muted{color:var(--muted)}
.pos{color:var(--good);font-weight:700}.neg{color:var(--weak);font-weight:700}
.forecast td.odds,.results td.odds{font-weight:500;min-width:62px}
.forecast td{padding-top:9px;padding-bottom:9px}
.chg{font-family:var(--mono);font-size:.78rem;font-weight:500;white-space:nowrap}
.chg.up{color:var(--good)}.chg.down{color:var(--weak)}.chg.flat{color:var(--muted)}
.spark{display:block}.spark-mid{stroke:#ddd;stroke-dasharray:2 2}

/* movers */
.movers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mover{background:var(--card);padding:14px 16px;border-top:4px solid var(--good)}
.mover.falling{border-top-color:var(--weak)}
.mover-tag{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--good)}
.mover.falling .mover-tag{color:var(--weak)}
.mover-team{font-weight:800;font-size:1.05rem;margin:2px 0 4px}
.mover-odds{font-size:.9rem;margin-bottom:4px}

/* matchups */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.game{position:relative;display:flex;flex-direction:column;background:var(--card);padding:16px 16px 14px;--team-a:#23798a;--team-b:#c98a14;
--team-a-soft:#a9d3da;--team-b-soft:#f0d29b}
.gtag{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:2px 7px;border-radius:10px}
.gtag.hot{background:var(--ink);color:#fff;position:absolute;top:-8px;right:12px}
.faceoff{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.fside{min-width:0}.side-b{text-align:right}
.fname{font-weight:700;font-size:.95rem;line-height:1.2;color:var(--ink);overflow-wrap:anywhere;
min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fside.fav .fname{font-weight:900}
.fmeta{font-size:.7rem;color:var(--muted);margin-top:2px}
.faceoff{margin-bottom:10px}
.fprob{font-size:1.9rem;font-weight:500;line-height:1.05;margin-top:4px;letter-spacing:-1px}
.fside.fav .fprob{font-weight:800}
.side-a .fprob{color:var(--team-a)}.side-b .fprob{color:var(--team-b)}
.vs{font-family:var(--mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;padding-top:3px}
.gbar{display:flex;height:6px;margin:auto 0 12px;border-radius:3px;overflow:hidden;gap:2px}
.gbar .ga{background:var(--team-a)}.gbar .gb{flex:1;background:var(--team-b)}
.seats{position:relative;padding-top:6px}
.seat-row{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.seat{font-size:.6rem;font-weight:800;letter-spacing:.2px;text-align:center;padding:7px 0;color:var(--ink);
white-space:nowrap;overflow:hidden}
.seat-row .seat:first-child{border-radius:3px 0 0 3px}.seat-row .seat:last-child{border-radius:0 3px 3px 0}
.seats{padding-bottom:6px}
.seat-mark{position:absolute;left:50%;top:0;bottom:0;width:0;pointer-events:none}
.seat-mark::before{content:"";position:absolute;top:-2px;left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.seat-mark::after{content:"";position:absolute;bottom:0;left:-1px;width:2px;height:5px;background:var(--ink)}
.r0{background:var(--team-a);color:#fff}.r1{background:var(--team-a-soft)}
.r2{background:#e4e4e4;color:var(--ink-2)}
.r3{background:var(--team-b-soft)}.r4{background:var(--team-b);color:#fff}
.seat-legend{display:flex;gap:2px;margin:6px 0 16px;max-width:420px;--team-a:#23798a;--team-b:#c98a14;
--team-a-soft:#a9d3da;--team-b-soft:#f0d29b}
.seat-legend .info{flex:0 0 auto;padding:0 6px;font-size:.9rem;color:var(--ink-2);align-self:center}
.seat-legend .seat{flex:1;font-family:var(--mono);font-weight:500;text-transform:uppercase;font-size:.58rem;padding:4px 0}
.gnote{font-size:.72rem;color:var(--muted);margin-top:8px}

/* results */
.results .winner{color:var(--ink)}
.results .loser{color:var(--muted);font-weight:500}
.results .score{font-weight:500;font-size:.95rem}
.badge{display:inline-block;margin-left:8px;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;
padding:1px 6px;background:var(--accent);color:#fff;vertical-align:1px}

/* power rankings */
.ranks{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px}
.rk-row{display:flex;gap:12px;background:var(--card);border-top:4px solid var(--ink);padding:14px}
.rk{display:flex;flex-direction:column;align-items:center;min-width:34px}
.rk-num{font-family:var(--mono);font-size:1.5rem;font-weight:700;line-height:1}
.rk-move{font-family:var(--mono);font-size:.7rem;margin-top:4px}
.rk-move.up{color:var(--good)}.rk-move.down{color:var(--weak)}.rk-move.flat{color:var(--muted)}
.rk-body{flex:1;min-width:0}
.rk-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card-name{font-weight:800;font-size:1.05rem}
.rk-headline{font-size:.9rem;font-weight:600;margin:4px 0 6px;line-height:1.35}
.rk-stats{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;font-size:.72rem;color:var(--muted);margin-bottom:8px}
.rk-stats span{white-space:nowrap}.rk-stats .spark{vertical-align:middle;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-size:.62rem;font-weight:600;padding:1px 6px;letter-spacing:.4px}
.facts{list-style:none;font-size:.82rem;color:var(--ink-2);margin-bottom:6px}
.facts li{padding:4px 0 4px 14px;position:relative;line-height:1.4}
.facts li::before{content:"";position:absolute;left:2px;top:.85em;width:5px;height:5px;background:var(--accent)}
.facts b{color:var(--ink)}
.facts .tip.wide:hover::after,.facts .tip.wide:focus::after{left:0;right:auto;font-weight:500}
.rk-body details summary{cursor:pointer;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:4px 0}
.notes{list-style:none;font-size:.8rem;color:var(--ink-2)}.notes li{padding:5px 0;border-top:1px solid var(--rule-2)}
.notes b{color:var(--ink);text-transform:uppercase;font-size:.64rem;letter-spacing:.6px}

/* player top-10 lists */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px 22px}
.topcol h3{font-size:.9rem;letter-spacing:1px;color:var(--ink);padding:8px 10px;margin:0;background:var(--card);border-top:4px solid var(--good)}
.topcol.cold h3{border-top-color:var(--weak)}
.toplist thead th{border-top:1px solid var(--rule-2)}
.toplist td{height:64px}
.toplist td.rank{width:26px;padding-right:2px;text-align:right}
.toplist .team{white-space:normal}
.toplist tbody tr:first-child .team{font-size:1rem}
.toplist .sub{white-space:nowrap}
.toplist td.big{font-size:1rem;font-weight:700}
.emo{font-size:.9rem;letter-spacing:1px;white-space:nowrap}
.tip{position:relative;cursor:help;outline:none}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;
transform:translateX(-50%);background:var(--ink);color:#fff;font:500 .7rem/1.3 var(--sans);letter-spacing:0;
padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:30;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tip.wide:hover::after,.tip.wide:focus::after{white-space:normal;width:280px;left:auto;right:0;transform:none}
.h2info{font-size:.95rem;font-weight:400;color:var(--muted);vertical-align:middle}
.tip.h2info:hover::after,.tip.h2info:focus::after{left:0;right:auto;letter-spacing:0;text-transform:none}
.box{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) repeat(2,minmax(0,1.45fr)) minmax(0,1fr);
gap:3px;margin-top:6px;max-width:480px}
.box span{display:flex;flex-direction:column;align-items:center;padding:3px 0 2px;border-radius:4px;background:#f6f6f6;line-height:1.15}
.box b{font-size:.78rem;font-weight:500;color:var(--ink);white-space:nowrap}
.box i{font-style:normal;font-family:var(--sans);font-size:.55rem;font-weight:600;letter-spacing:.6px;color:var(--muted)}
.box .zero b{color:var(--muted)}
.box .up,.box-legend .up{background:var(--good-soft)}.box .down,.box-legend .down{background:var(--bad-soft)}
.box .up.big{background:var(--good)}.box .down.big{background:var(--bad)}
.box .big b,.box .big i{color:#fff}.box .big b{font-weight:700}
.box .key b{font-weight:700}
.box .up.key{box-shadow:inset 0 -3px 0 var(--good)}.box .down.key{box-shadow:inset 0 -3px 0 var(--bad)}
.box .big.key{box-shadow:none}
.box-legend span{padding:0 5px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.74rem;color:var(--muted);margin-top:10px}
@media (max-width:640px){.box{grid-template-columns:repeat(3,minmax(0,1fr));max-width:260px}.toplist .sub{white-space:normal}}

/* playoff picture */
.seeds-map td.seed{font-size:.74rem;padding:6px 3px;min-width:30px;text-align:center}
.seeds-map th.num{text-align:center}
.seeds-map td.out,.seeds-map th.out{border-left:2px dashed var(--ink);min-width:64px}
.seeds-map td.first,.seeds-map th.first{border-left:2px solid var(--ink)}
.seeds-map td.odds{font-weight:500;padding-left:10px}
h3.bk-title-h{font-size:.9rem;color:var(--ink);margin:26px 0 4px}
.bracket{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:14px;align-items:center}
.bk-rounds{display:grid;gap:14px}
.bk-half{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:center}
.bk-col{display:grid;gap:10px}
.bk-box{background:var(--card);padding:10px 12px;border-left:4px solid var(--good)}
.bk-title .bk-box{border-left-color:var(--accent)}
.bk-head{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-2);margin-bottom:6px}
.bk-box ul{list-style:none}
.bk-box li{position:relative;display:flex;justify-content:space-between;gap:8px;font-size:.8rem;padding:3px 4px;margin-bottom:2px}
.bk-box li i{position:absolute;left:0;top:0;bottom:0;background:var(--good-soft);z-index:0}
.bk-box li span{position:relative;z-index:1}
.bk-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-pair{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.bk-sub{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
@media (max-width:480px){.bk-pair{grid-template-columns:1fr}}
.bk-foot{font-size:.72rem;color:var(--muted);margin-top:6px}
@media (max-width:760px){.bracket,.bk-half{grid-template-columns:1fr}}

/* draft archive */
details.archive{background:var(--card);padding:0 14px}
details.archive summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:.86rem;color:var(--ink)}
details.archive summary:hover{color:var(--accent)}
details.archive[open]{padding-bottom:14px}
details.archive section{margin:18px 0 28px}
details.archive h2{font-size:1.2rem}
.filter{margin-bottom:8px;font-size:.8rem;color:var(--ink-2)}.filter select{margin-left:6px;padding:2px 4px}
.board{max-height:640px;overflow-y:auto;border:1px solid var(--rule)}
.board thead th{position:sticky;top:0;background:var(--card)}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--accent)}
th.sort.asc::after{content:" ▲";font-size:.6rem}th.sort.desc::after{content:" ▼";font-size:.6rem}

/* unused views kept in code */
.seeds td.seed{font-size:.75rem;padding:5px 4px;min-width:30px}
.seeds td.seedcut{border-right:2px dashed var(--ink)}
.h2h td{font-size:.75rem;padding:5px 4px;min-width:34px;text-align:center}
.h2h td.self{background:#ddd}
.h2h th.vert{height:120px;vertical-align:bottom;padding:4px}
.h2h th.vert span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}

@media (max-width:640px){
nav{flex-wrap:nowrap;overflow-x:auto;gap:0 18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap}
section{scroll-margin-top:52px}
h1{font-size:2.1rem}h2{font-size:1.3rem}.dek{font-size:.98rem}
.hide-sm{display:none}
.grid td,.grid th{padding-left:5px;padding-right:5px}
.forecast .sub{display:none}.team{white-space:normal}
}

/* team view */
.tv-pick select{font:inherit;font-weight:600;padding:4px 6px;max-width:100%}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.tv-card{background:var(--card);border-top:4px solid var(--ink);padding:12px 14px 14px;min-width:0}
.tv-card.tv-wide{grid-column:1/-1}
.tv-card>h3{margin-bottom:2px}
.tv-card>h3 .tip::after{text-transform:none;letter-spacing:0;font-weight:500}
.tv-asof{margin-bottom:10px}
.tv-big{font-weight:800;font-size:1.05rem;line-height:1.25;margin-bottom:6px}
.tv-odds{display:inline-block;font-size:1.3rem;font-weight:700;padding:2px 10px;margin-bottom:10px}
.tv-cats{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:6px;font-size:.78rem}
.tv-cats>b{min-width:52px;font-size:.66rem;text-transform:uppercase;letter-spacing:.8px}
.tv-safe{color:var(--good)}.tv-lost{color:var(--weak)}.tv-close{color:var(--ink-2)}
.tv-chip{padding:2px 6px;border-radius:3px;font-weight:700;white-space:nowrap}
.tv-stats{display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;font-size:.78rem;color:var(--ink-2);margin-bottom:8px}
.tv-stats b{color:var(--ink)}.tv-stats .spark{display:inline-block;vertical-align:middle}
.tv-table td,.tv-table th{padding-top:5px;padding-bottom:5px}.tv-table td>b{white-space:nowrap}
.badge.tv-tight{background:var(--ink-2);margin-left:6px}
.tv-level{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:1px 6px}
.tv-strong{background:var(--good-soft);color:var(--good)}.tv-weak{background:var(--weak-soft);color:var(--weak)}
.tv-average{color:var(--muted)}
.tv-word{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.tv-seeds{display:inline-grid;grid-template-columns:repeat(14,9px);gap:1px;vertical-align:middle}
.tv-seeds i{display:block;height:14px}.tv-seeds i.cut{box-shadow:1px 0 0 0 var(--ink)}
.tv-note,.tv-none{margin-top:6px}
.tv-card .duo{gap:14px}
.tv-games{margin:-4px 0 6px}
.tv-sub{font-size:.66rem;text-transform:uppercase;letter-spacing:1px;color:var(--ink-2);margin:14px 0 2px}
.tv-bar{display:inline-block;width:52px;height:8px;background:var(--rule-2);vertical-align:middle;margin-right:6px}
.tv-bar i{display:block;height:100%}
.grid td.tv-rank{text-align:center;font-weight:600;min-width:38px}.grid th.tv-col{text-align:center}
.grid th.tv-season{border-left:2px solid var(--ink)}.grid tr td.tv-rank:last-child{border-left:2px solid var(--ink)}
.tv-moves tr.tv-more{display:none}.tv-moves.tv-open tr.tv-more{display:table-row}
.tv-moves td{vertical-align:top}.tv-moves td:first-child{white-space:nowrap}
.tv-toggle{font:inherit;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);
background:none;border:0;padding:10px 0 0;cursor:pointer}
/* team.html: the same style in a cool blue-grey tint, so the two pages are told apart; data colors stay */
body.team-page{--bg:#eaeef3;--ink:#1b2a41;--ink-2:#4a5a70;--muted:#7d8a9c;--rule:#cfd7e2;--rule-2:#e3e9f0;--accent:#2f6ea8}
@media (max-width:640px){.tv-card{padding:10px 8px 12px}.tv-seeds{grid-template-columns:repeat(14,6px)}
.tv-bar{width:26px;margin-right:4px}}
</style>

(function () {

        '</td><td class="num mono">' + (r.all_play ? rec(r.all_play) : '\u2014') + '</td><td class="num mono">' +
        (r.luck === null ? '\u2014' : signed(r.luck, 2)) + '</td><td class="num mono odds" style="' + (r.playoff === null ? '' : fill(r.playoff)) +
        '">' + (r.playoff === null ? '\u2014' : pct(r.playoff)) + '</td><td class="num mono">' + (r.top_seed === null ? '\u2014' : pct(r.top_seed)) +
        '</td><td>' + seedStrip(r.seeds) + '</td></tr>'; });
    var po = t.history.map(function (r) { return r.playoff; });
    return card('Season so far', 'Data to the end of week ' + V.played, info,
      '<div class="tv-stats"><span>Playoff odds by week</span>' + spark(po) + '</div>' +
      table('<th>After</th><th class="num">Record</th><th class="num">All-play</th><th class="num">Luck</th>' +
        '<th class="num">Playoffs</th><th class="num">#1 seed</th><th>Seed odds</th>', rows), true);
  }

  function catsBlock(t) {
    var info = 'Season totals of the final weeks. Percentages are for the season; other categories are per week. ' +
      'All-play: share of matchups this category wins against every other team, each final week (a tie counts half). ' +
      'Record: won, lost and tied in the real games.';
    var asof = 'Data to the end of week ' + V.played;
    if (!t.cats.length) return card('Category profile', asof, info, none('No final week yet.'));
    var rows = t.cats.map(function (c) {
      var ap = c.all_play;
      return '<tr><td>' + c.cat + '</td><td class="num mono">' + catval(c.cat, c.value) + '</td><td class="num mono muted">' +
        catval(c.cat, c.avg) + '</td><td class="num">' + (ap === null ? '\u2014' : '<span class="tv-bar"><i style="width:' +
        Math.round(ap * 100) + '%;' + heat(ap) + '"></i></span><span class="mono">' + pct(ap) + '</span>') + '</td><td class="num mono">' +
        c.record.join('\u2013') + '</td></tr>'; });
    return card('Category profile', asof, info,
      table('<th>Cat</th><th class="num">Team</th><th class="num">League</th><th class="num">All-play</th><th class="num">Record</th>', rows));
  }

  function names(list) { return list.length ? list.map(esc).join(', ') : '\u2014'; }
  function moveKind(m) {
    if (m.kind === 'trade') return 'Trade' + (m.partner ? ' with ' + label(m.partner) : '');
    return m.kind === 'Free Agent' ? 'Free agent' : 'Waiver ' + esc(m.kind.replace(' Waiver', '')); }
  function dayText(iso) { var d = new Date(iso + 'T12:00:00');
    return d.toLocaleString('en-US', {month: 'short'}) + ' ' + d.getDate(); }
  function tone(v) { var r = Math.round(v * 10); return r > 0 ? 'pos' : r < 0 ? 'neg' : ''; }   // the class of the shown value
  function val(v, games) { return v === null ? '<span class="muted">\u2014</span>' :
    '<b class="' + tone(v) + '">' + signed(v) + '</b><div class="sub">' + games + (games === 1 ? ' game' : ' games') + '</div>'; }

  function movesBlock(t) {
    var m = t.moves, s = m.season;
    var info = 'Each trade of the team, over the games its players started after it, to the next move of any player in it ' +
      '(only finished weeks count). Got: what the players you received gave you, in your starting lineup. Gave: what the players you ' +
      'traded away gave their new team, in its starting lineup. Value: each started game\u2019s 9-category score above a waiver ' +
      'player\u2019s game. 1.0 is one average starter\u2019s game over a waiver player\u2019s game, so +5 is like 5 extra good games, ' +
      'and a waiver-level player is 0 (an open roster spot after a 2-for-1 adds nothing). A trade with few games counts less: ' +
      'the values are multiplied by games / (games + ' + SHRINK + '), with the started games of both sides, so they grow as the players play. ' +
      'Margin: got minus gave. ' +
      'A trade this week shows a dash.';
    var asof = 'Data to the end of week ' + V.played;
    if (!m.rows.length) return card('Trades', asof, info, none('No trade this season.'), true);
    var dash = '<span class="muted">\u2014</span>';
    function side(list, games) {
      var line = games === null ? '' : (games ? games + (games === 1 ? ' game started' : ' games started') : 'No games started');
      return '<b>' + names(list) + '</b>' + (line ? '<div class="sub">' + line + '</div>' : ''); }
    function num(v, bold) { return v === null ? dash : (bold ? '<b class="' + tone(v) + '">' : '<span>') + signed(v) + (bold ? '</b>' : '</span>'); }
    var rows = m.rows.map(function (r, k) {
      return '<tr class="' + (k >= SHOWN_MOVES ? 'tv-more' : '') + '"><td class="mono">' + dayText(r.day) + '</td><td>' +
        side(r.added, r.pending ? null : r.games) + '<div class="sub">' + moveKind(r) + '</div></td><td class="num mono">' + num(r.got) +
        '</td><td>' + side(r.dropped, r.pending ? null : (r.drop_games || 0)) + '</td><td class="num mono">' + num(r.gave) +
        '</td><td class="num mono">' + num(r.margin, true) + '</td></tr>'; });
    var stats = '<div class="tv-stats"><span>' + m.rows.length + (m.rows.length === 1 ? ' trade' : ' trades') + '</span><span>Net <b class="' +
      tone(s.margin) + '">' + signed(s.margin) + '</b></span></div>';
    var more = m.rows.length > SHOWN_MOVES ? '<button type="button" class="tv-toggle">Show all ' + m.rows.length + ' trades</button>' : '';
    return card('Trades', asof, info, stats + '<div class="tv-moves">' + table('<th>Date</th><th>Got</th><th class="num">Value</th>' +
      '<th>Gave</th><th class="num">Value</th><th class="num">Margin</th>', rows) + '</div>' + more, true);
  }






  function show(id) {
    var t = V.teams[String(id)];
    if (!t) return;
    sel.value = String(id);
    document.title = V.labels[String(id)] + ' · Team view';
    // Half-width cards go in pairs (coming weeks + category profile); the others span the row, so no row has an empty half.
    out.innerHTML = [historyBlock(t), comingBlock(t), catsBlock(t), gamesBlock(t), movesBlock(t)].join('');
  }
  out.addEventListener('click', function (e) {
    var b = e.target.closest('.tv-toggle');
    if (!b) return;
    var box = b.previousElementSibling, open = box.classList.toggle('tv-open');
    b.textContent = open ? 'Show fewer trades' : 'Show all ' + box.querySelectorAll('tbody tr').length + ' trades';
  });
  function fromHash() { var m = /team=(\d+)/.exec(location.hash); return m && V.teams[m[1]] ? m[1] : null; }
  sel.addEventListener('change', function () {
    show(sel.value);
    if (history.replaceState) history.replaceState(null, '', '#team=' + sel.value);
  });
  window.addEventListener('hashchange', function () { var id = fromHash(); if (id) show(id); });
  var start = fromHash();
  // No team in the link: open a random team, so each visit shows a different one.
  show(start || V.order[Math.floor(Math.random() * V.order.length)]);
})();
</script></section>
</body></html>

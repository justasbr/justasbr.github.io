<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIBA Five — EuroBasket Draft</title>
<meta name="description" content="Draft an all-time FIBA five and see whether it becomes an S-tier EuroBasket favorite.">
<style>
:root {
  --bg: #f7f5f0;
  --ink: #171717;
  --muted: #6e6a61;
  --line: #d8d2c5;
  --panel: #fffdfa;
  --panel-2: #ece7dc;
  --red: #c7352f;
  --blue: #1e64a5;
  --green: #237052;
  --gold: #b98923;
  --shadow: 0 18px 50px rgba(40, 36, 28, 0.12);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    linear-gradient(135deg, rgba(199, 53, 47, 0.08), transparent 28%),
    linear-gradient(225deg, rgba(30, 100, 165, 0.10), transparent 32%),
    var(--bg);
}
button, input, select { font: inherit; }
button { cursor: pointer; }
.shell { max-width: 1220px; margin: 0 auto; padding: 20px; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 0 18px;
  border-bottom: 2px solid var(--ink);
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: 0; line-height: 0.95; }
.brand span { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.12em; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.icon-button, .primary, .secondary {
  border: 1px solid var(--ink);
  background: var(--panel);
  color: var(--ink);
  min-height: 42px;
  border-radius: 6px;
  padding: 0 14px;
  font-weight: 800;
  box-shadow: 3px 3px 0 var(--ink);
}
.primary { background: var(--red); color: white; }
.secondary.active { background: var(--ink); color: white; }
.primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.grid {
  display: grid;
  grid-template-columns: minmax(280px, 350px) 1fr;
  gap: 20px;
  padding-top: 22px;
  align-items: start;
}
.panel {
  background: rgba(255, 253, 250, 0.92);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.side { position: sticky; top: 14px; overflow: hidden; }
.side-head { padding: 16px; border-bottom: 1px solid var(--line); }
.mode-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.mode-row button { min-height: 42px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 800; }
.mode-row button.active { background: var(--blue); color: white; border-color: var(--blue); }
.rounds { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dot { height: 9px; flex: 1; background: var(--panel-2); border-radius: 99px; }
.dot.done { background: var(--green); }
.dot.current { background: var(--red); }
.lineup { padding: 16px; display: grid; gap: 10px; }
.slot {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 10px;
  align-items: center;
  min-height: 64px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px;
  background: white;
}
.slot-code { font-weight: 950; font-size: 0.86rem; color: var(--red); }
.slot-name { font-weight: 850; }
.slot-meta { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.spin-panel { padding: 18px; margin-bottom: 18px; }
.spin-display {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  align-items: stretch;
}
.spin-card {
  min-height: 88px;
  border: 1px solid var(--ink);
  border-radius: 8px;
  padding: 12px;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.label { color: var(--muted); font-size: 0.72rem; font-weight: 850; text-transform: uppercase; letter-spacing: 0.13em; }
.spin-value { font-size: clamp(1.25rem, 3vw, 2rem); font-weight: 950; line-height: 1; }
.spin-action { min-width: 112px; }
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 14px;
}
.filters input, .filters select {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  padding: 0 10px;
}
.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.player-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  min-height: 184px;
  display: grid;
  gap: 10px;
}
.player-card.hidden-stats .stat-value { filter: blur(6px); }
.player-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.player-name { font-size: 1.04rem; font-weight: 950; line-height: 1.1; }
.badge { font-size: 0.7rem; font-weight: 950; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--panel-2); white-space: nowrap; }
.badge.legend { background: #271814; color: #ffcf69; }
.badge.star { background: #e4eef8; color: #174d82; }
.badge.rotation { background: #e8e4db; color: #59544b; }
.player-meta { color: var(--muted); font-size: 0.82rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); border-radius: 6px; padding: 7px; min-width: 0; }
.stat-value { font-weight: 950; display: block; }
.stat-label { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; font-weight: 850; }
.pick-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pick-row button {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  min-width: 42px;
  min-height: 34px;
  font-weight: 900;
}
.pick-row button:hover { background: var(--ink); color: white; }
.empty {
  padding: 34px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: rgba(255, 253, 250, 0.7);
}
.result { display: none; padding: 18px; margin-top: 18px; }
.result.visible { display: block; }
.result-hero {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 18px;
  align-items: center;
}
.tier {
  aspect-ratio: 1;
  border: 2px solid var(--ink);
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 4rem;
  font-weight: 950;
  background: var(--gold);
  color: #1b1405;
  box-shadow: 5px 5px 0 var(--ink);
}
.result h2 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.4rem); line-height: 1.05; }
.result p { color: var(--muted); margin: 8px 0 0; }
.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.metric { background: white; border: 1px solid var(--line); border-radius: 7px; padding: 12px; }
.metric strong { display: block; font-size: 1.45rem; }
.bars { margin-top: 16px; display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 100px 1fr 48px; gap: 10px; align-items: center; font-size: 0.84rem; }
.bar { height: 10px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--blue); }
.sources { color: var(--muted); font-size: 0.76rem; padding: 16px 0 24px; }
.sources a { color: var(--blue); }
@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .side { position: static; }
  .spin-display { grid-template-columns: 1fr; }
  .players { grid-template-columns: 1fr; }
  .result-hero { grid-template-columns: 1fr; }
  .tier { width: 132px; }
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>FIBA Five</h1>
      <span>Build an all-time EuroBasket monster</span>
    </div>
    <div class="top-actions">
      <button class="secondary" id="shareButton">Share</button>

  <main class="grid">
    <aside class="panel side">
      <div class="side-head">

          <button data-mode="classic" class="active">Classic</button>
          <button data-mode="memory">Memory</button>

      </div>
      <div class="rounds" id="rounds"></div>
      <div class="lineup" id="lineup"></div>

    <section>
      <div class="panel spin-panel">
        <div class="spin-display">
          <div class="spin-card">
            <span class="label">Country pool</span>
            <strong class="spin-value" id="spinCountry">?</strong>
          </div>
          <div class="spin-card">
            <span class="label">Era</span>
            <strong class="spin-value" id="spinEra">?</strong>
          </div>
          <button class="primary spin-action" id="spinButton">Spin</button>
        </div>
        <div class="filters">
          <input id="searchInput" placeholder="Search player">
          <select id="sortSelect">
            <option value="score">FIBA score</option>
            <option value="scoring">Scoring</option>
            <option value="creation">Creation</option>
            <option value="defense">Defense</option>
            <option value="spacing">Spacing</option>
            <option value="resume">Resume</option>
          </select>
        </div>
      </div>

      <div class="players" id="players"></div>

      <div class="panel result" id="result"></div>
    </section>
  </main>

  <footer class="sources" id="sources"></footer>
</div>

function playerScore(player) {

    player.defense * WEIGHTS.defense + player.spacing * WEIGHTS.spacing + player.resume * WEIGHTS.resume +

function seededRandom(seed) {

  if (value <= 0) value += 2147483646;
  return () => {
    value = value * 16807 % 2147483647;
    return (value - 1) / 2147483646;

}

function winProbability(a, b) {

function scoreLineup() {

    components[key] = picks.reduce((sum, pick) => sum + pick.player[key], 0) / picks.length;

  const base = picks.reduce((sum, pick) => sum + playerScore(pick.player), 0) / picks.length;
  const notes = [];
  let bonus = 0;

  else if (components.creation < 64) { penalty += 4; notes.push("Short on creators"); }
  if (components.spacing >= 82) { bonus += 1.5; notes.push("Tournament-proof spacing"); }
  else if (components.spacing < 58) { penalty += 3; notes.push("Spacing squeeze"); }

function simulateTournament(userRating, sims = 4500) {

  function play(a, b) {

    const winnerA = rng() < probA;
    const expectedMargin = (a.rating - b.rating) / 28;
    let margin = Math.round(expectedMargin + (rng() + rng() + rng() - 1.5) * 18);
    if (winnerA && margin <= 0) margin = 1 + Math.floor(rng() * 8);

    return { winner: winnerA ? a.code : b.code, margin };

    const names = ["Round of 16", "Quarterfinal", "Semifinal", "Final"];
    let userAlive = true;
    for (let r = 0; r < names.length; r++) {
      const winners = [];
      for (let i = 0; i < current.length; i += 2) {
        const a = current[i], b = current[i + 1];
        const game = play(a, b);
        winners.push(game.winner === a.code ? a : b);
        if ((a.code === "USER" || b.code === "USER")) {
          if (game.winner === "USER") userWins++;
          else if (userAlive) { userAlive = false; addFinish(names[r]); }
        }
      }
      current = winners;
      if (r === 1 && current.some(t => t.code === "USER")) semi++;

  if (mode === "chaos") rows = rows.filter(p => p.tier !== "legend" || picks.length >= 3);
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q) || p.country.toLowerCase().includes(q));
  rows.sort((a, b) => (sort === "score" ? playerScore(b) - playerScore(a) : b[sort] - a[sort]));
  if (!rows.length) {
    container.innerHTML = `<div class="empty">No eligible players left for this spin. Spin again.</div>`;
    return;
  }
  container.innerHTML = rows.map(player => {
    const slots = availableSlots(player);
    const hidden = mode === "memory" ? " hidden-stats" : "";
    return `<article class="player-card${hidden}">
      <div class="player-top">
        <div>
          <div class="player-name">${player.name}</div>
          <div class="player-meta">${player.country} · ${player.era} · ${player.positions.join("/")} · confidence ${player.confidence}</div>
        </div>
        <span class="badge ${player.tier}">${player.tier}</span>
      </div>
      <div class="stats">
        ${["scoring","creation","defense","spacing","rebounding","resume"].map(key => `<div class="stat"><span class="stat-value">${player[key]}</span><span class="stat-label">${key}</span></div>`).join("")}
      </div>
      <div class="pick-row">
        ${slots.length ? slots.map(slot => `<button onclick="pickPlayer('${player.code}','${slot}')" title="Draft as ${slot}">${slot}</button>`).join("") : `<span class="player-meta">No open legal slot</span>`}
      </div>
    </article>`;
  }).join("");
}

function spin() {
  if (picks.length >= 5) return;
  const options = DATA.spinOptions.filter(opt => {
    let pool = DATA.players.filter(p => p.countryGroup === opt.country_group && p.era === opt.era);
    if (mode === "chaos") pool = pool.filter(p => p.tier !== "legend" || picks.length >= 3);
    return pool.some(p => availableSlots(p).length);
  });
  const idx = Math.floor(Math.random() * options.length);
  currentSpin = options[idx];
  currentPool = DATA.players.filter(p => p.countryGroup === currentSpin.country_group && p.era === currentSpin.era);
  document.getElementById("spinCountry").textContent = currentSpin.country_group;
  document.getElementById("spinEra").textContent = currentSpin.era;
  renderPlayers();
}

function pickPlayer(code, slot) {
  const player = DATA.players.find(p => p.code === code);
  if (!player || picks.length >= 5 || picks.some(p => p.slot === slot)) return;
  picks.push({ player, slot });
  currentSpin = null;
  currentPool = [];
  document.getElementById("spinCountry").textContent = "?";
  document.getElementById("spinEra").textContent = "?";
  renderAll();
  if (picks.length === 5) showResult();
}

function showResult() {
  const lineup = scoreLineup();
  const sim = simulateTournament(lineup.rating);
  const tier = tierFromTitle(sim.titlePct, lineup.score);
  lastResult = { lineup, sim, tier };
  const result = document.getElementById("result");
  const blurb = {
    "S+": "Gold favorite. This roster makes the bracket feel unfair.",
    "S": "Real title favorite. Anything short of a medal would sting.",
    "A": "Title contender. Not perfect, dangerous enough to beat anyone once.",
    "B": "Medal threat. The ceiling is real, but the bracket has to cooperate.",
    "C": "Knockout team. Fun, flawed, and probably one superstar short.",
    "D": "Group-stage chaos. Great names, awkward fit."
  }[tier];
  result.classList.add("visible");
  result.innerHTML = `<div class="result-hero">
    <div class="tier">${tier}</div>
    <div>
      <h2>${blurb}</h2>
      <p>${picks.map(p => p.player.name).join(" · ")}</p>
    </div>
  </div>
  <div class="metric-grid">
    <div class="metric"><strong>${sim.titlePct}%</strong><span class="label">Win title</span></div>
    <div class="metric"><strong>${sim.medalPct}%</strong><span class="label">Reach final</span></div>
    <div class="metric"><strong>${sim.knockoutPct}%</strong><span class="label">Make knockouts</span></div>
    <div class="metric"><strong>${sim.avgWins}</strong><span class="label">Expected wins</span></div>
  </div>
  <div class="bars">
    ${Object.entries(lineup.components).map(([key, value]) => `<div class="bar-row"><strong>${key}</strong><div class="bar"><span style="width:${Math.min(100, value)}%"></span></div><span>${value.toFixed(1)}</span></div>`).join("")}
  </div>
  <p>${lineup.notes.length ? lineup.notes.join(" · ") : "No major fit flags."} Most common finish: ${sim.finish}. Rating: ${lineup.rating}.</p>`;
  result.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetDraft() {
  picks = [];
  currentSpin = null;
  currentPool = [];
  lastResult = null;
  document.getElementById("spinCountry").textContent = "?";
  document.getElementById("spinEra").textContent = "?";
  document.getElementById("result").classList.remove("visible");
  document.getElementById("result").innerHTML = "";
  renderAll();
}

function share() {
  const text = lastResult
    ? `My FIBA Five graded ${lastResult.tier} with ${lastResult.sim.titlePct}% EuroBasket title odds: ${picks.map(p => p.player.name).join(", ")}`
    : "FIBA Five: draft an all-time national-team lineup and chase S-tier EuroBasket odds.";
  navigator.clipboard?.writeText(text);
  document.getElementById("shareButton").textContent = "Copied";
  setTimeout(() => document.getElementById("shareButton").textContent = "Share", 1200);
}

function renderAll() {
  renderRounds();
  renderLineup();
  renderPlayers();
  document.getElementById("spinButton").disabled = picks.length >= 5;
}

document.getElementById("spinButton").addEventListener("click", spin);
document.getElementById("resetButton").addEventListener("click", resetDraft);
document.getElementById("shareButton").addEventListener("click", share);
document.getElementById("searchInput").addEventListener("input", renderPlayers);
document.getElementById("sortSelect").addEventListener("change", renderPlayers);
document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
  mode = button.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b === button));
  renderPlayers();
}));
document.getElementById("sources").innerHTML = `Data model generated ${DATA.generatedAt}. Sources: ${DATA.sources.map(s => `<a href="${s.url}">${s.label}</a>`).join(" · ")}.`;
renderAll();
</script>
</body>
</html>

<head>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;

    padding: 3rem 1.25rem;

    display: block;
    background: #fff;
    border: 1px solid #ddd;
    border-left: 4px solid #d64541;

    margin-bottom: 1rem;
    color: inherit;
    text-decoration: none;

<main>
  <h1>Sports projections</h1>
  <a class="card" href="euroleague/">

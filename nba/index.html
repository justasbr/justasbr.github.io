<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketbolistai — Playoff Preview</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f0f0f0;
  color: #222;
  font-family: 'Atlas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  line-height: 1.5;
  padding: 20px;
  max-width: 1060px;
  margin: 0 auto;
}

.header {
  border-bottom: 2px solid #222;
  padding-bottom: 12px;
  margin-bottom: 32px;
}

h1 {
  font-size: 2rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 2px;
  color: #222;
}

.subtitle {
  color: #888;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
}

h2 {
  font-size: 1.1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 16px;
  color: #222;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h2 .toggle-arrow {
  font-size: 0.7rem;
  color: #aaa;
  transition: transform 0.2s;
}

h2:hover {
  color: #d64541;
}

.section {
  margin-bottom: 44px;
}

.section-content {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
  max-height: 5000px;
  opacity: 1;
}

.section.collapsed .section-content {
  max-height: 0;
  opacity: 0;
  margin: 0;
}

.section.collapsed h2 {
  margin-bottom: 0;
  border-bottom-color: transparent;
}

.section.collapsed h2 .toggle-arrow {
  transform: rotate(-90deg);
}

/* Standings table */
.standings-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.standings-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #ccc;
  color: #666;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.standings-table td {
  padding: 7px 10px;
  border-bottom: 1px solid #e0e0e0;
}

.standings-table tr:hover {
  background: #e8e8e8;
}

.standings-table .team-name {
  font-weight: 600;
  color: #222;
}

.standings-table tr.playoff-line td {
  border-bottom: 2px solid #d64541;
}

.standings-table .seed-col {
  color: #d64541;
  font-weight: 700;
  width: 36px;
}

.standings-table .eff-wins {
  color: #555;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Championship odds bar chart */
.card {
  background: #fff;
  border-radius: 4px;
  padding: 20px 24px;
  border: 1px solid #ddd;
}

.champ-bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
}

.champ-bar-team {
  width: 180px;
  font-size: 0.82rem;
  font-weight: 600;
  color: #222;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.champ-bar-track {
  flex: 1;
  height: 20px;
  background: #eee;
  border-radius: 2px;
  overflow: hidden;
}

.champ-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: #d64541;
  transition: width 0.5s ease;
  min-width: 2px;
}

.champ-bar-pct {
  min-width: 50px;
  font-size: 0.85rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #222;
}

/* Bracket */
.bracket-container {
  background: #fff;
  border-radius: 4px;
  padding: 20px 24px;
  border: 1px solid #ddd;
  overflow-x: auto;
}

.bracket-grid {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) minmax(170px, 1fr) minmax(160px, 1fr);
  gap: 0;
  min-width: 600px;
}

.bracket-round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 0 6px;
}

.bracket-matchup {
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin: 6px 0;
}

.bracket-team {
  display: flex;
  align-items: center;
  padding: 7px 10px;
  background: #f7f7f7;
  border: 1px solid #ddd;
  font-size: 0.82rem;
  font-weight: 500;
  color: #333;
  white-space: nowrap;
  position: relative;
}

.bracket-team:first-child {
  border-radius: 4px 4px 0 0;
  border-bottom: none;
}

.bracket-team:last-child {
  border-radius: 0 0 4px 4px;
}

.bracket-team .seed {
  color: #d64541;
  font-weight: 700;
  margin-right: 6px;
  font-size: 0.72rem;
  min-width: 18px;
}

.bracket-team .pct {
  margin-left: auto;
  padding-left: 8px;
  color: #888;
  font-weight: 700;
  font-size: 0.72rem;
}

.bracket-team.favorite {
  background: #fff;
  font-weight: 600;
}

.bracket-team.clickable {
  cursor: pointer;
  transition: all 0.12s;
}

.bracket-team.clickable:hover {
  background: #eef;
  border-color: #999;
}

.bracket-team.selected {
  background: #d64541 !important;
  border-color: #d64541 !important;
  color: #fff;
}

.bracket-team.selected .seed {
  color: #ffcdd2;
}

.bracket-team.selected .pct {
  color: #ffcdd2;
}

.bracket-label {
  text-align: center;
  color: #999;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 4px 0 6px;
  font-weight: 600;
}

/* Advancement table */
.advancement-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 0.85rem;
}

.advancement-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #ccc;
  color: #666;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  user-select: none;
  transition: color 0.15s;
}

.advancement-table th:hover {
  color: #d64541;
}

.advancement-table th.sort-active {
  color: #d64541;
}

.advancement-table th .sort-arrow {
  margin-left: 4px;
  font-size: 0.6rem;
}

.advancement-table td {
  padding: 7px 10px;
  border-bottom: 1px solid #e0e0e0;
  font-variant-numeric: tabular-nums;
}

.advancement-table .team-name {
  font-weight: 600;
  color: #222;
}

/* Matchup breakdowns */
.matchup-card {
  background: #fff;
  border-radius: 4px;
  padding: 16px 20px;
  border: 1px solid #ddd;
  margin-bottom: 12px;
}

.matchup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-weight: 700;
  font-size: 0.9rem;
}

.matchup-header .team-left { color: #d64541; }
.matchup-header .team-right { color: #2b7bb9; }
.matchup-header .vs { color: #999; font-size: 0.75rem; }

.tug-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}

.tug-label {
  width: 36px;
  font-size: 0.7rem;
  font-weight: 600;
  color: #888;
  text-align: center;
  flex-shrink: 0;
}

.tug-track {
  flex: 1;
  height: 12px;
  background: #eee;
  border-radius: 2px;
  overflow: hidden;
  display: flex;
  position: relative;
}

.tug-left {
  height: 100%;
  background: #d64541;
  transition: width 0.3s;
}

.tug-right {
  height: 100%;
  background: #2b7bb9;
  transition: width 0.3s;
  margin-left: auto;
}

.tug-marker {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: #ccc;
}

.tug-elo {
  width: 36px;
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  text-align: center;
  flex-shrink: 0;
}

.tug-elo.left { color: #d64541; }
.tug-elo.right { color: #2b7bb9; }

.matchup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 900px) {
  .matchup-grid { grid-template-columns: 1fr; }
}

/* Season awards */
.awards-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.awards-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #ccc;
  color: #666;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.awards-table td {
  padding: 8px 10px;
  border-bottom: 1px solid #e0e0e0;
}

.awards-table .cat-name { font-weight: 700; color: #d64541; }
.awards-table .team-name { font-weight: 600; color: #222; }

/* Radar grid */
.radar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.radar-card {
  background: #fff;
  border-radius: 4px;
  padding: 14px;
  border: 1px solid #ddd;
  text-align: center;
}

.radar-card h3 {
  font-size: 0.82rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: #222;
}

.radar-blurb {
  font-size: 0.7rem;
  color: #888;
  line-height: 1.4;
  margin-bottom: 6px;
  font-style: italic;
}

.radar-card canvas { max-height: 200px; }

.radar-card.playoff {
  border-left: 3px solid #d64541;
}

/* Superlatives */
.superlatives-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.superlative-card {
  background: #fff;
  border-radius: 4px;
  padding: 14px 16px;
  border: 1px solid #ddd;
  border-left: 3px solid #d64541;
}

.superlative-team {
  font-size: 0.75rem;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.superlative-award {
  font-size: 0.95rem;
  font-weight: 700;
  color: #222;
  margin-bottom: 6px;
}

.superlative-reason {
  font-size: 0.78rem;
  color: #666;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 0.72rem;
  margin-top: 48px;
  padding: 16px;
  border-top: 1px solid #ddd;
}

@media (max-width: 600px) {
  h1 { font-size: 1.4rem; }
  body { padding: 12px; }
  .radar-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .radar-card { padding: 10px; }
  .champ-bar-team { width: 110px; font-size: 0.75rem; }
  .matchup-grid { grid-template-columns: 1fr; }
  .superlatives-grid { grid-template-columns: 1fr; }
}
</style>

</head>

// Seed lookup: team name -> original seed number
const SEED_OF = {};
DATA.bracket.seeds.forEach((t, i) => { SEED_OF[t] = i + 1; });

// H2H lookup: returns team1 win% (0-100)
function getH2H(t1, t2) {
  const key1 = t1 + ' vs ' + t2;
  const key2 = t2 + ' vs ' + t1;
  if (DATA.h2h_matrix[key1] !== undefined) return DATA.h2h_matrix[key1];
  if (DATA.h2h_matrix[key2] !== undefined) return 100 - DATA.h2h_matrix[key2];
  return 50;
}

// 2. Interactive bracket with reseeding — seeds shown in every round
const bracketState = { qf: [null,null,null,null], sf: [null,null] };
let currentBracketSeeds = null;

function resetBracketState() {
  bracketState.qf = [null,null,null,null];
  bracketState.sf = [null,null];
}

function bracketClickQF(matchIdx, team) {
  if (bracketState.qf[matchIdx] === team) {
    bracketState.qf[matchIdx] = null;
    bracketState.sf = [null, null];
  } else {
    if (bracketState.qf[matchIdx] !== null) bracketState.sf = [null, null];
    bracketState.qf[matchIdx] = team;
  }
  renderBracket(currentBracketSeeds);
}

function bracketClickSF(sfIdx, team) {
  bracketState.sf[sfIdx] = bracketState.sf[sfIdx] === team ? null : team;
  renderBracket(currentBracketSeeds);
}

function renderBracket(seeds) {
  currentBracketSeeds = seeds;
  const s = seeds;
  const qfPairs = [[0,7],[1,6],[2,5],[3,4]];

  function teamHtml(name, pct, isFav, cls, round, matchIdx) {
    const seed = SEED_OF[name];
    const seedLabel = seed ? `<span class="seed">#${seed}</span>` : '';
    return `<div class="bracket-team ${cls} ${isFav ? 'favorite' : ''}" data-round="${round}" data-match="${matchIdx}" data-team="${name.replace(/"/g, '&quot;')}">
      ${seedLabel}${name}<span class="pct">${pct.toFixed(0)}%</span>
    </div>`;
  }

  function placeholderTeam(text) {
    return `<div class="bracket-team" style="border-radius:4px;border:1px dashed #ccc;background:transparent;color:#aaa;justify-content:center;font-style:italic;font-size:0.75rem">${text}</div>`;
  }

  // QF round
  let qfHtml = '<div class="bracket-label">Quarterfinals</div>';
  qfPairs.forEach(([hi, lo], mi) => {
    const p = getH2H(s[hi], s[lo]);
    const picked = bracketState.qf[mi];
    const render = (seedIdx, pct) => {
      const team = s[seedIdx];
      const fav = pct >= 50;
      const cls = picked === team ? 'clickable selected' : 'clickable';
      return teamHtml(team, pct, fav, cls, 'qf', mi);
    };
    qfHtml += `<div class="bracket-matchup">
      ${render(hi, p)}
      ${render(lo, 100 - p)}
    </div>`;
  });

  // Reseed QF winners for SF
  const qfWinners = bracketState.qf.filter(w => w !== null);
  let sfPairs = [];
  if (qfWinners.length === 4) {
    const sorted = [...qfWinners].sort((a, b) => SEED_OF[a] - SEED_OF[b]);
    sfPairs = [[sorted[0], sorted[3]], [sorted[1], sorted[2]]];
  }

  // SF round
  let sfHtml = '<div class="bracket-label">Semifinals</div>';
  if (sfPairs.length === 2) {
    sfPairs.forEach(([w1, w2], si) => {
      const p = getH2H(w1, w2);
      const picked = bracketState.sf[si];
      const renderSF = (team, pct) => {
        const fav = pct >= 50;
        const cls = picked === team ? 'clickable selected' : 'clickable';
        return teamHtml(team, pct, fav, cls, 'sf', si);
      };
      sfHtml += `<div class="bracket-matchup" style="flex:1">
        ${renderSF(w1, p)}
        ${renderSF(w2, 100 - p)}
      </div>`;
    });
  } else {
    for (let si = 0; si < 2; si++) {
      sfHtml += `<div class="bracket-matchup" style="flex:1">
        ${placeholderTeam('Pick all QF winners')}
      </div>`;
    }
  }

  // Finals
  let finalsHtml = '<div class="bracket-label">Finals</div>';
  const f1 = bracketState.sf[0];
  const f2 = bracketState.sf[1];
  if (f1 && f2) {
    const p = getH2H(f1, f2);
    finalsHtml += `<div class="bracket-matchup" style="flex:1">
      ${teamHtml(f1, p, p >= 50, '', 'fin', 0)}
      ${teamHtml(f2, 100 - p, 100 - p >= 50, '', 'fin', 0)}
    </div>`;
  } else {
    finalsHtml += `<div class="bracket-matchup" style="flex:1">
      ${placeholderTeam('Pick SF winners')}
    </div>`;
  }

  const container = document.getElementById('bracket-visual');
  container.innerHTML = `<div class="bracket-grid">
    <div class="bracket-round">${qfHtml}</div>
    <div class="bracket-round">${sfHtml}</div>
    <div class="bracket-round">${finalsHtml}</div>
  </div>`;

  container.onclick = function(e) {
    const el = e.target.closest('.bracket-team.clickable');
    if (!el) return;
    const round = el.dataset.round;
    const matchIdx = parseInt(el.dataset.match);
    const team = el.dataset.team;
    if (round === 'qf') bracketClickQF(matchIdx, team);
    else if (round === 'sf') bracketClickSF(matchIdx, team);
  };
}

renderBracket(DATA.bracket.seeds);

    } else {
      sortCol = col;
      sortAsc = colDef.asc;
    }
    render();
  });

  render();
})();

// 4. Radar charts — playoff teams first
(function() {
  const grid = document.getElementById('radar-grid');
  const labels = DATA.cat_labels;
  const playoffTeams = DATA.bracket.seeds;

  const teamBlurbs = {
    "Hard'n'Braun": "Elite in six cats — FTs, steals, blocks, threes, boards, scoring. Only the TO hole keeps them honest.",
    "Amen to That": "Punt FT/3PM to its logical extreme. League-best in four cats, league-worst in two.",
    "Scottie does know": "Punt-scoring build with league-best blocks and TOs. Locks up three cats.",
    "DomiNiko LaJokic": "Punt-blocks done right — league-best AST, elite FTs, solid scoring.",
    "Champagnie Showers": "Punt-assists extreme — league-best 3PM and solid FTs/TOs.",
    "Dydis nesvarbu": "Well-rounded punt-blocks — elite 3PM, STL, FT, AST.",
    "Jaunas tiltas ir kamuolys.": "Elite AST, STL, TO discipline with solid threes.",
    "Lazdavotojai": "League-best scoring with elite FG%. Quiet two-cat lock.",
    "SkinnyHeadLuka": "Elite FG% with solid scoring and blocks.",
    "Jackson brothers": "Solid FG%, AST, STL, but FT and 3PM are backbreaking.",
    "Hart attack": "Elite AST and BLK, but scoring and FG% are punted.",
    "Slim Twins Wins": "League-best FTs and TOs with solid blocks.",
    "ADK(H)D": "Scores and shoots threes, but BLK and AST are massive holes.",
    "Beaves and Butthead": "Slight edges in boards and assists, negative everywhere else.",
  };

  const allTeams = DATA.standings.map(s => s.team);
  const nonPlayoff = allTeams.filter(t => !playoffTeams.includes(t));
  const ordered = [...playoffTeams, ...nonPlayoff];

  ordered.forEach(team => {
    const values = DATA.radar_data[team];
    if (!values) return;
    const isPlayoff = playoffTeams.includes(team);
    const blurb = teamBlurbs[team] || '';
    const card = document.createElement('div');
    card.className = isPlayoff ? 'radar-card playoff' : 'radar-card';
    card.innerHTML = `<h3>${team}</h3><p class="radar-blurb">${blurb}</p><canvas></canvas>`;
    grid.appendChild(card);

    const ctx = card.querySelector('canvas').getContext('2d');
    const shifted = values.map(v => v + 150);
    const color = isPlayoff ? '#d64541' : '#999';
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: labels,
        datasets: [{
          data: shifted,
          backgroundColor: isPlayoff ? 'rgba(214, 69, 65, 0.15)' : 'rgba(150, 150, 150, 0.1)',
          borderColor: color,
          borderWidth: 2,
          pointBackgroundColor: color,
          pointRadius: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) { return (ctx.raw - 150 >= 0 ? '+' : '') + (ctx.raw - 150); }
            }
          }
        },
        scales: {
          r: {
            min: 0,
            max: 300,
            ticks: {
              stepSize: 75,
              color: '#aaa',
              backdropColor: 'transparent',
              font: { size: 8 },
              callback: v => { const d = v - 150; return d === 0 ? '0' : (d > 0 ? '+' + d : d); }
            },
            grid: { color: '#e0e0e0' },
            angleLines: { color: '#e0e0e0' },
            pointLabels: {
              color: '#666',
              font: { size: 10, weight: '600' }
            }
          }
        }
      }
    });
  });
})();

// 6. Season Awards
(function() {
  const table = document.getElementById('awards-table');
  let html = '<thead><tr><th>Category</th><th>King</th><th>Record</th><th>Win%</th></tr></thead><tbody>';
  DATA.season_awards.forEach(a => {
    html += `<tr>
      <td class="cat-name">${a.category}</td>
      <td class="team-name">${a.team}</td>
      <td>${a.record}</td>
      <td style="font-weight:700">${a.pct.toFixed(1)}%</td>
    </tr>`;
  });
  html += '</tbody>';
  table.innerHTML = html;
})();

// 7. Superlatives
(function() {
  const grid = document.getElementById('superlatives-grid');
  DATA.superlatives.forEach(s => {
    const card = document.createElement('div');
    card.className = 'superlative-card';
    card.innerHTML = `
      <div class="superlative-team">${s.team}</div>
      <div class="superlative-award">${s.award}</div>
      <div class="superlative-reason">${s.reason}</div>
    `;
    grid.appendChild(card);
  });
})();

// Section collapse/expand
document.querySelectorAll('.section > h2').forEach(h2 => {
  h2.addEventListener('click', () => {
    h2.parentElement.classList.toggle('collapsed');
  });
});
